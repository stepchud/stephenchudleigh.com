<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <title>Contact Stephen: Ask a question or send comments</title>
  <link href="/main.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="main">
    <!--#include virtual="/navmenu.html" -->

    <div class="content contact">
      <h2>E-mail Stephen</h2>
      <form id="contact" action="mailto:stephen@stephenchudleigh.com">
      <table class="contact-details">
      <tr>
        <td class='label'><strong>Subject:</strong></td>
        <td><input type=text name="subject" class="inputtext" placeholder="Nice website!"></td></tr>
      <tr>
        <td class='label'><strong>Message:</strong></td>
        <td><textarea rows=10 cols=50 name="body" class="inputtext" placeholder="That rug really tied the room together."></textarea></td>
      </tr>
      </table>
      <div class="buttons">
        <input type="submit" value="Open in E-mail">
        <input type="reset">
      </div>
      </form>
      <p>Or write to <a href="mailto:stephen@stephenchudleigh.com">stephen@stephenchudleigh.com</a> directly.</p>
      <script type="text/javascript">
        // Hand the message to the visitor's mail app. Building the URL here,
        // rather than submitting the form to mailto:, percent-encodes spaces
        // instead of turning them into "+", which some mail apps show as-is.
        document.getElementById('contact').onsubmit = function () {
          var f = this;
          // Split so Cloudflare's email obfuscation leaves the script alone.
          location.href = 'mailto:stephen' + '@' + 'stephenchudleigh.com' +
            '?subject=' + encodeURIComponent(f.subject.value) +
            '&body=' + encodeURIComponent(f.body.value);
          return false;
        };
      </script>
    </div>
  </div>
</body>
</html>
